name: Fetch Social Feed

# Instagram + Bluesky の投稿を取得して VPS に配置する
# 利用 Secrets（release-tools 共通）:
#   PROD_SSH_PRIVATE_KEY, PROD_SSH_KNOWN_HOSTS : VPS SSH 接続（既存）
# 利用 Variables（release-tools 共通）:
#   PROD_HOST, PROD_SSH_USER                    : 既存
#   SOCIAL_FEED_PATH                            : 配置先（例: /opt/art-gallery/dist/social）
# ファイル配置ユーザーは inventory の app_user（artgallery）と一致

on:
  schedule:
    # 6時間おき（0:00 / 6:00 / 12:00 / 18:00 UTC）
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout art-gallery-release-tools
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests instaloader

      - name: Fetch Instagram posts
        run: |
          mkdir -p data
          python scripts/fetch_instagram.py

      - name: Fetch Bluesky posts
        run: python scripts/fetch_bluesky.py

      - name: Build social_feed.json
        run: python scripts/build_feed.py

      - name: Deploy to VPS
        env:
          SOCIAL_FEED_PATH: ${{ vars.SOCIAL_FEED_PATH || '/opt/art-gallery/dist/social' }}
          SSH_KEY: ~/.ssh/deploy_key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${{ vars.PROD_SSH_USER }}@${{ vars.PROD_HOST }}" \
            "sudo mkdir -p '${SOCIAL_FEED_PATH}' && sudo chown artgallery:artgallery '${SOCIAL_FEED_PATH}'"
          rsync -avz --checksum \
            --rsync-path="sudo -u artgallery rsync" \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            dist/social_feed.json \
            "${{ vars.PROD_SSH_USER }}@${{ vars.PROD_HOST }}:${SOCIAL_FEED_PATH}/social_feed.json"
