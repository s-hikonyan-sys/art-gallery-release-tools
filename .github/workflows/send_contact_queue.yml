name: Send Contact Queue

# backend の /app/contact_queue/ に溜まったお問い合わせを Slack に送信する
# 利用 Secrets（release-tools 共通）:
#   PROD_SSH_PRIVATE_KEY, PROD_SSH_KNOWN_HOSTS : VPS SSH 接続（既存）
#   SLACK_CONTACT_WEBHOOK_URL                   : お問い合わせ Slack 送信先（追加）
# 利用 Variables:
#   PROD_HOST, PROD_SSH_USER                    : VPS 接続情報（既存）
#   CONTACT_QUEUE_PATH                          : キューディレクトリ（ホストパス例: /opt/art-gallery/src/art-gallery-backend/contact_queue）
#   PROD_APP_USER                               : ファイル操作ユーザー（例: artgallery）

on:
  schedule:
    # 5分おき
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  send-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout art-gallery-release-tools
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Pull contact queue from VPS
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            "${{ vars.PROD_SSH_USER }}@${{ vars.PROD_HOST }}:${{ vars.CONTACT_QUEUE_PATH }}/" \
            /tmp/contact_queue/
        continue-on-error: true  # キューが空の場合は rsync が 0 件でも正常終了

      - name: Send queued contacts to Slack
        env:
          SLACK_CONTACT_WEBHOOK_URL: ${{ secrets.SLACK_CONTACT_WEBHOOK_URL }}
          QUEUE_DIR:         /tmp/contact_queue
          REMOVED_LIST_FILE: /tmp/contact_queue/.removed_files
        run: python scripts/send_contact_queue.py

      - name: Remove processed queue files on VPS
        if: always()
        env:
          APP_USER: ${{ vars.PROD_APP_USER || 'artgallery' }}
        run: |
          REMOVED_LIST="/tmp/contact_queue/.removed_files"
          if [ ! -f "${REMOVED_LIST}" ]; then
            echo "[INFO] No removed files list."
            exit 0
          fi
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          REMOTE="${{ vars.PROD_SSH_USER }}@${{ vars.PROD_HOST }}"
          QUEUE_PATH="${{ vars.CONTACT_QUEUE_PATH }}"
          while IFS= read -r filename; do
            [ -z "${filename}" ] && continue
            ssh ${SSH_OPTS} "${REMOTE}" \
              "sudo -u ${APP_USER} rm -f '${QUEUE_PATH}/${filename}'"
          done < "${REMOVED_LIST}"
        continue-on-error: true

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "${{ secrets.SLACK_CONTACT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"⚠️ send_contact_queue 失敗: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
